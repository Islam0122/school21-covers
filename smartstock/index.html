const REPORTS = [
  ['sales_day', 'Продажи по дням', 'calendar-days'], ['sales_product', 'Продажи по товарам', 'package'], ['profit_category', 'Прибыль по категориям', 'pie-chart'],
  ['movements', 'Движение склада', 'arrow-left-right'], ['writeoffs', 'Списания', 'trash-2'], ['purchases', 'Закупки', 'truck'], ['employees', 'Эффективность сотрудников', 'users']
];
function reportRange() {
  let from = parseIsoDate(ui.reports.from), to = parseIsoDate(ui.reports.to);
  if (!Number.isFinite(from)) from = addDays(startOfDay(Date.now()), -29);
  if (!Number.isFinite(to)) to = startOfDay(Date.now());
  if (to < from) { const t = from; from = to; to = t; }
  return { from, to: addDays(to, 1), label: fmtDate(from) + ' — ' + fmtDate(to) };
}
function buildReport(type, from, to) {
  const M = v => ({ v, t: fmtMoney(v), num: true });
  const N = (v, s) => ({ v, t: fmtNum(v) + (s || ''), num: true });
  const T = v => ({ v, t: v });
  const sales = salesInRange(from, to);
  const profit = can('profit');
  const r = { columns: [], rows: [], totals: null };
  if (type === 'sales_day') {
    r.columns = ['Дата', 'Чеков', 'Товаров, шт.', 'Выручка', 'Скидки'].concat(profit ? ['Себестоимость', 'Валовая прибыль'] : [], ['Средний чек']);
    const days = Math.max(1, dayIndex(from, to - 1) + 1);
    for (let i = days - 1; i >= 0; i--) {
      const d0 = addDays(from, i), d1 = addDays(d0, 1);
      const ss = sales.filter(s => s.date >= d0 && s.date < d1);
      const rev = calculateRevenue(ss);
      r.rows.push([T(fmtDate(d0)), N(ss.length), N(unitsSold(ss)), M(rev), M(sum(ss, s => s.discount))].concat(profit ? [M(calculateCOGS(ss)), M(calculateGrossProfit(ss))] : [], [M(ss.length ? rev / ss.length : 0)]));
    }
    const rev = calculateRevenue(sales);
    r.totals = [T('Итого'), N(sales.length), N(unitsSold(sales)), M(rev), M(sum(sales, s => s.discount))].concat(profit ? [M(calculateCOGS(sales)), M(calculateGrossProfit(sales))] : [], [M(sales.length ? rev / sales.length : 0)]);
  } else if (type === 'sales_product') {
    const agg = {};
    sales.forEach(s => s.items.forEach(it => { const a = agg[it.productId] || (agg[it.productId] = { name: it.name, qty: 0, rev: 0, cost: 0 }); a.qty += it.qty; a.rev += lineRevenue(s, it); a.cost += it.qty * it.cost; }));
    const total = calculateRevenue(sales);
    r.columns = ['Товар', 'SKU', 'Категория', 'Продано, шт.', 'Выручка'].concat(profit ? ['Себестоимость', 'Прибыль'] : [], ['Доля выручки']);
    Object.entries(agg).sort((a, b) => b[1].rev - a[1].rev).forEach(([id, a]) => { const p = findProduct(id); r.rows.push([T(a.name), T(p ? p.sku : '—'), T(p ? p.category : 'Удалён')].concat([N(a.qty), M(a.rev)], profit ? [M(a.cost), M(a.rev - a.cost)] : [], [{ v: Math.round(a.rev / total * 1000) / 10, t: fmtPct(a.rev / total), num: true }])); });
    r.totals = [T('Итого'), T(''), T(''), N(unitsSold(sales)), M(total)].concat(profit ? [M(calculateCOGS(sales)), M(calculateGrossProfit(sales))] : [], [T('100%')]);
  } else if (type === 'profit_category') {
    const agg = {};
    sales.forEach(s => s.items.forEach(it => { const p = findProduct(it.productId); const c = p ? p.category : 'Удалённые товары'; const a = agg[c] || (agg[c] = { qty: 0, rev: 0, cost: 0 }); a.qty += it.qty; a.rev += lineRevenue(s, it); a.cost += it.qty * it.cost; }));
    r.columns = ['Категория', 'Продано, шт.', 'Выручка'].concat(profit ? ['Себестоимость', 'Валовая прибыль', 'Маржа'] : []);
    Object.entries(agg).sort((a, b) => (b[1].rev - b[1].cost) - (a[1].rev - a[1].cost)).forEach(([c, a]) => r.rows.push([T(c), N(a.qty), M(a.rev)].concat(profit ? [M(a.cost), M(a.rev - a.cost), { v: Math.round((a.rev - a.cost) / a.rev * 1000) / 10, t: fmtPct((a.rev - a.cost) / a.rev), num: true }] : [])));
    const rev = calculateRevenue(sales), g = calculateGrossProfit(sales);
    r.totals = [T('Итого'), N(unitsSold(sales)), M(rev)].concat(profit ? [M(calculateCOGS(sales)), M(g), { v: rev ? Math.round(g / rev * 1000) / 10 : 0, t: fmtPct(rev ? g / rev : 0), num: true }] : []);
  } else if (type === 'movements') {
    const list = state.movements.filter(m => m.date >= from && m.date < to);
    r.columns = ['Дата', 'Тип', 'Товар', 'Склад', 'Изменение, шт.', 'Сумма по закупке', 'Документ / причина', 'Сотрудник'];
    list.forEach(m => { const delta = m.type === 'transfer' ? m.qty : m.type === 'adjust' ? (m.delta != null ? m.delta : m.qty) : m.type === 'in' ? m.qty : -m.qty;
      r.rows.push([T(fmtDT(m.date)), T(MOVE_TYPES[m.type].label), T(m.name), T((WAREHOUSES[m.warehouse] || '') + (m.toWarehouse ? ' → ' + WAREHOUSES[m.toWarehouse] : '')), { v: delta, t: (delta > 0 && m.type !== 'transfer' ? '+' : '') + delta, num: true }, M(m.qty * m.cost), T([m.doc, m.reason].filter(Boolean).join(' · ')), T(employeeName(m.employeeId))]); });
    const byType = t => sum(list.filter(m => m.type === t), m => m.qty);
    r.summary = 'Поступления: +' + byType('in') + ' шт. · Списания: −' + byType('writeoff') + ' шт. · Продажи (через кассу): −' + byType('sale') + ' шт. · Перемещения: ' + byType('transfer') + ' шт. · Корректировки: ' + list.filter(m => m.type === 'adjust').length;
  } else if (type === 'writeoffs') {
    const list = writeoffsInRange(from, to);
    r.columns = ['Дата', 'Товар', 'Склад', 'Количество, шт.', 'Себестоимость', 'Причина', 'Сотрудник'];
    list.forEach(m => r.rows.push([T(fmtDT(m.date)), T(m.name), T(WAREHOUSES[m.warehouse] || ''), N(m.qty), M(m.qty * m.cost), T(m.reason), T(employeeName(m.employeeId))]));
    r.totals = [T('Итого'), T(''), T(''), N(sum(list, m => m.qty)), M(sum(list, m => m.qty * m.cost)), T(''), T('')];
  } else if (type === 'purchases') {
    const list = state.purchases.filter(p => p.createdAt >= from && p.createdAt < to).sort((a, b) => b.createdAt - a.createdAt);
    r.columns = ['Номер', 'Дата', 'Поставщик', 'Статус', 'Позиций', 'Сумма', 'Дата получения'];
    list.forEach(p => r.rows.push([T(p.number), T(fmtDate(p.createdAt)), T((findSupplier(p.supplierId) || {}).name || '—'), T(PO_STATUS[p.status].label), N(p.items.length), M(purchaseValue(p)), T(p.receivedAt ? fmtDate(p.receivedAt) : '—')]));
    const recv = list.filter(p => p.status === 'received');
    r.totals = [T('Итого'), T(''), T(''), T('получено: ' + recv.length), N(sum(list, p => p.items.length)), M(sum(list.filter(p => p.status !== 'cancelled'), purchaseValue)), T('')];
    r.summary = 'Сумма без отменённых заказов. Получено поставок на ' + fmtMoney(sum(recv, purchaseValue)) + '.';
  } else if (type === 'employees') {
    const total = calculateRevenue(sales);
    r.columns = ['Сотрудник', 'Роль', 'Чеков', 'Товаров, шт.', 'Выручка', 'Средний чек', 'Доля выручки'];
    state.employees.forEach(e => { const ss = sales.filter(s => s.employeeId === e.id); const rev = calculateRevenue(ss);
      r.rows.push([T(e.name), T(ROLES[e.role].label), N(ss.length), N(unitsSold(ss)), M(rev), M(ss.length ? rev / ss.length : 0), { v: total ? Math.round(rev / total * 1000) / 10 : 0, t: fmtPct(total ? rev / total : 0), num: true }]); });
    r.rows.sort((a, b) => b[4].v - a[4].v);
    r.totals = [T('Итого'), T(''), N(sales.length), N(unitsSold(sales)), M(total), M(sales.length ? total / sales.length : 0), T('100%')];
  }
  return r;
}

function formData(form) {
  const fd = new FormData(form);
  const data = {};
  for (const [k, v] of fd.entries()) {
    if (k in data) data[k] = [].concat(data[k], v);
    else data[k] = v;
  }
  form.querySelectorAll('input[type=checkbox][name]').forEach(cb => { const v = data[cb.name]; data[cb.name] = v == null ? [] : [].concat(v); });
  return data;
}
function bindEvents() {

    if (!e.target.closest('.dropdown') && !e.target.closest('[data-action="toggle-notifs"],[data-action="toggle-profile"]') && !e.target.closest('.search')) closeDropdowns();
    if (e.target === $('#modalRoot')) { closeModal(); return; }
    if (!el || el.disabled) return;
    const fn = ACTIONS[attr(el, 'action')];
    if (!fn) return;
    if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
    try { fn(el, e); } catch (err) { console.error(err); toast(err.message || 'Ошибка', 'error'); }
  });
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-input]');
    if (el && INPUTS[attr(el, 'input')]) INPUTS[attr(el, 'input')](el, e);
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]');
    if (el && CHANGES[attr(el, 'change')]) CHANGES[attr(el, 'change')](el, e);
  });
  document.addEventListener('submit', e => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    const name = attr(form, 'form');
    const data = formData(form);
    const submitter = e.submitter ? e.submitter.value : '';
    try {
      if (name === 'modal') {
        if (!modalState || !modalState.onSubmit) return;
        const token = modalState;
        const res = modalState.onSubmit(data, submitter);
        if (res !== false && modalState === token) closeModal();
      } else if (FORMS[name]) FORMS[name](data, submitter);
    } catch (err) { showFormError(err.message || 'Ошибка'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('#modalRoot').classList.contains('open')) closeModal();
      closeDropdowns();
      document.body.classList.remove('sidebar-open');
    }
    if (e.key === 'Enter' && e.target.id === 'posSearch') {
      e.preventDefault();
      const q = e.target.value.trim().toLowerCase();
      if (!q) return;
      const exact = state.products.find(p => p.barcode === q || p.sku.toLowerCase() === q);
      const matches = state.products.filter(p => (p.name + ' ' + p.sku + ' ' + p.barcode).toLowerCase().includes(q) && (ui.pos.cat === 'all' || p.category === ui.pos.cat));
      const target = exact || (matches.length === 1 ? matches[0] : null);
      if (!target) return toast(matches.length ? 'Уточните запрос: найдено ' + matches.length + ' товаров' : 'Товар не найден', 'error');
      if (posAdd(target.id, 1)) { ui.pos.q = ''; e.target.value = ''; renderCart(); renderPOSGrid(); toast('Добавлено: ' + target.name); }
    }
    if (e.key === 'Enter' && e.target.matches('.kpi[data-action]')) e.target.click();
  });
  $('#csvInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast('Файл слишком большой (максимум 2 МБ)', 'error'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const res = importProductsCSV(reader.result);
        closeModal();
        openModal({ title: 'Результат импорта', size: 'sm',
          body: '<div class="stat-row" style="grid-template-columns:1fr 1fr"><div class="stat"><div class="lbl">Добавлено</div><div class="val t-success">' + res.created + '</div></div><div class="stat"><div class="lbl">Обновлено</div><div class="val t-primary">' + res.updated + '</div></div></div>' +
            (res.errors.length ? '<div class="section-title">Ошибки (' + res.errors.length + ')</div><ul style="margin:0;padding-left:18px;color:var(--danger);font-size:13px">' + res.errors.slice(0, 20).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<p class="hint">Все строки импортированы без ошибок.</p>') });
      } catch (err) { toast(err.message, 'error'); }
    };
    reader.onerror = () => toast('Не удалось прочитать файл', 'error');
    reader.readAsText(file, 'utf-8');
  });
  window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo(0, 0); });
  window.addEventListener('storage', e => { if (e.key === STORAGE_KEY && e.newValue) { loadState(); render(); } });
}

/* ---------- Запуск ---------- */
function init() {
  loadState();
  bindEvents();
  if (!location.hash) history.replaceState(null, '', '#/dashboard');
  render();
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
}
</script>
</body>
</html>
